plugins {
    id 'com.android.application'
}

android {
    namespace 'com.supermov.tv'
    // compileSdk 36 是 media3 1.10.0 的硬要求（其 AAR 声明 minCompileSdk=36）
    compileSdk 36

    defaultConfig {
        applicationId "com.supermov.tv"
        // media3 1.10.0 起要求 API 23（Android 6.0）+；1.8.1 是最后支持 API 21 的版本
        minSdk 23
        targetSdk 34
        versionCode 25
        versionName "1.25"
    }

    signingConfigs {
        release {
            // CI 里从 Secrets 注入；本地编译时可用 app/release.keystore.jks
            def ksBase64 = System.getenv("KEYSTORE_BASE64")
            if (ksBase64) {
                def ksFile = rootProject.file("release.keystore.jks")
                if (!ksFile.exists()) {
                    ksFile.getParentFile().mkdirs()
                    ksFile.bytes = new ByteArrayInputStream(Base64.decoder.decode(ksBase64))
                }
                storeFile ksFile
            } else {
                storeFile rootProject.file("release.keystore.jks")
            }
            storePassword System.getenv("KEYSTORE_PASSWORD") ?: "djydxs2026"
            keyAlias System.getenv("KEY_ALIAS") ?: "djydxs"
            keyPassword System.getenv("KEY_PASSWORD") ?: "djydxs2026"
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.google.code.gson:gson:2.10.1'

    // ---- 在线播放：NEXIO media3 fork（源码 composite build，基线 1.10.0）----
    // 坐标名一个字没改，但 settings.gradle 里的 dependencySubstitution 会把它们
    // 整体换成 johnneerdael/media 里的源码工程（:lib-exoplayer / -hls / :lib-ui）。
    // 所以这里的版本号只用于「基线对齐」，真正编译的是 fork 的源码。
    // exoplayer 核心 + HLS（M3U8 转码流兜底）+ ui（PlayerView，TV 遥控器可用）
    def media3Version = "1.10.0"
    implementation "androidx.media3:media3-exoplayer:$media3Version"
    implementation "androidx.media3:media3-exoplayer-hls:$media3Version"
    implementation "androidx.media3:media3-ui:$media3Version"
    // media3 的 @UnstableApi 需要 @OptIn 标注，显式声明保证注解类在编译期可见
    implementation 'androidx.annotation:annotation:1.9.1'

    // ---- 下载：自研引擎（DlEngine + DlService），零第三方依赖 ----
    // 用 HttpURLConnection 做多分片 Range 并发 + 随机写入 + 断点续传，
    // 用前台服务承载队列与通知栏进度。
    // 刻意不引入 okhttp（会连带 kotlin-stdlib，APK 明显变大）与 WorkManager
    // （下载是长时间可感知任务，需要实时进度与随时暂停，WorkManager 的延迟调度模型不合适），
    // 顺带减少 AAR 元数据对 compileSdk 的要求，构建更稳。

    testImplementation 'junit:junit:4.13.2'
}
